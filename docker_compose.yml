services:
  opsguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsguard-copilot
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./documents:/app/documents
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
